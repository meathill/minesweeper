<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" width="640" height="128" role="img" aria-label="复盘示例：橙点低谷与紫三角冲高重合处为盲猜">
<title>复盘示例 - 如何一眼看出盲猜</title>
<rect x="0" y="0" width="640" height="128" rx="10" fill="#fffbeb" stroke="#fde68a"/>
<text x="12" y="14" font-family="ui-sans-serif,system-ui" font-size="9" font-weight="700" fill="#92400e">示例 · 怎么一眼看出盲猜</text>
<g transform="translate(12,22)">
  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="0.7">
    <rect x="36" y="0" width="520" height="74" fill="white" rx="4"/>
    <line x1="36" y1="56" x2="556" y2="56" stroke-dasharray="2 4" opacity="0.5"/>
    <line x1="36" y1="38" x2="556" y2="38" stroke-dasharray="2 4" opacity="0.5"/>
    <line x1="36" y1="20" x2="556" y2="20" stroke-dasharray="2 4" opacity="0.5"/>
    <line x1="36" y1="0" x2="556" y2="0" opacity="0.6"/>
    <line x1="36" y1="74" x2="556" y2="74"/>
  </g>
  <text x="4" y="6" font-size="7" fill="#64748b">10</text>
  <text x="8" y="77" font-size="7" fill="#64748b">0</text>
  <text x="560" y="6" font-size="6.5" fill="#7c3aed">100%</text>
  <text x="560" y="77" font-size="6.5" fill="#7c3aed">0%</text>
  <polyline fill="none" stroke="#4bc0c0" stroke-width="1.5" opacity="0.32" points="40,60 108,32 188,46 308,50 428,46 508,44 552,60"/>
  <polyline fill="none" stroke="#FF6B6B" stroke-width="1.5" opacity="0.32" points="40,68 108,60 188,64 308,58 428,44 508,60 552,68"/>
  <polyline fill="none" stroke="#f59e0b" stroke-width="2.1" stroke-linejoin="round" points="48,14 128,14 198,14 278,18 348,14 418,14 458,22 508,48 552,44"/>
  <circle cx="48" cy="14" r="3.6" fill="#22c55e" stroke="white" stroke-width="0.9"/>
  <circle cx="198" cy="14" r="3.6" fill="#22c55e" stroke="white" stroke-width="0.9"/>
  <circle cx="278" cy="18" r="3.6" fill="#f59e0b" stroke="white" stroke-width="0.9"/>
  <circle cx="458" cy="22" r="4" fill="#f59e0b" stroke="white" stroke-width="0.9"/>
  <circle cx="508" cy="48" r="5" fill="#ef4444" stroke="white" stroke-width="1.2"/>
  <polyline fill="none" stroke="#a855f7" stroke-width="1.6" stroke-dasharray="6 4" points="48,60 128,56 198,58 278,40 348,16 418,20 458,32 508,12 552,50"/>
  <polygon points="278,36 274,44 282,44" fill="#a855f7"/>
  <polygon points="508,8 503,17 513,17" fill="#a855f7" stroke="#7c3aed" stroke-width="0.6"/>
  <g transform="translate(490,48)">
    <rect x="-44" y="-34" width="88" height="20" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.9"/>
    <text x="0" y="-21" font-size="7" font-weight="700" fill="#92400e" text-anchor="middle">盲猜点 · 点此回溯</text>
    <line x1="0" y1="-14" x2="18" y2="6" stroke="#f59e0b" stroke-width="0.9" marker-end="url(#arr)"/>
  </g>
  <defs><marker id="arr" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#f59e0b"/></marker></defs>
  <text x="34" y="88" font-size="6.5" fill="#64748b">0:00</text>
  <text x="268" y="88" font-size="6.5" fill="#64748b">0:30</text>
  <text x="530" y="88" font-size="6.5" fill="#64748b">1:00</text>
</g>
<text x="12" y="118" font-family="ui-sans-serif,system-ui" font-size="7.5" fill="#92400e">橙点持续 10 分为最优；低谷处紫三角也冲高，就是在高概率格上盲猜 — 点击该点可直接高亮当时那块砖。</text>
</svg>
