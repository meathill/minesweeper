                  "text": "Meathill Minesweeper (minesweeper.meathill.com) es un buscaminas para aprender jugando con tableros de 9×9/16×16/16×30, sin clic derecho obligatorio, apertura en cadena con doble clic y Modo Aprendizaje: mapa de calor de probabilidad en vivo + puntuación de eficiencia, con repetición tras la partida."

                "@type": "Question",

                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Las restricciones provienen solo de los números abiertos (cada número exige exactamente N minas entre sus vecinas cerradas; las banderas se ignoran porque pueden estar mal). Las casillas de frontera se dividen en componentes y se enumeran con exactitud, las aisladas reparten las minas restantes a partes iguales, dando P(mina) 0-1 como capa verde→amarilla→roja al 75%."
                }
              },
              {
                "@type": "Question",
                "name": "¿Qué significa la eficiencia 0-10?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Puntuación por diferencia fija respecto a la mejor opción del momento: abrir se compara con la probabilidad mínima pMin, marcar con pMax; una diferencia de 5 puntos cuesta 1 punto y de 50 puntos llega a 0. La apertura en cadena siempre vale 10."
                }
              },

                "name": "¿Cómo se encadena con Apple / trackpad?",
